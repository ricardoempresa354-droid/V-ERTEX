<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>VÉRTEX AI</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- LOGIN -->

  <section id="auth" class="auth">

    <div class="auth-card">

      <div class="auth-logo">
        <svg viewBox="0 0 100 100">
          <path d="M14 10h27l9 17 9-17h27L50 90 14 10z"/>
        </svg>
      </div>

      <h1>VÉRTEX AI</h1>

      <p class="muted">
        Seu assistente para renda extra no digital.
      </p>

      <div class="auth-tabs">

        <button
          id="loginTab"
          class="auth-tab on"
          type="button"
          onclick="authMode('login')"
        >
          Entrar
        </button>

        <button
          id="registerTab"
          class="auth-tab"
          type="button"
          onclick="authMode('register')"
        >
          Criar conta
        </button>

      </div>

      <div id="authError" class="error"></div>

      <div id="authForm"></div>

    </div>

  </section>


  <!-- APLICAÇÃO -->

  <div id="app" class="app hidden">

    <!-- SIDEBAR -->

    <aside class="side">

      <div class="side-brand">

        <div class="brand-mark">
          <svg viewBox="0 0 100 100">
            <path d="M14 10h27l9 17 9-17h27L50 90 14 10z"/>
          </svg>
        </div>

        <div>
          <strong>VÉRTEX AI</strong>
          <span>Especialista em renda extra</span>
        </div>

      </div>

      <button
        class="new-chat"
        type="button"
        onclick="openAI('')"
      >
        <span>＋</span>
        Nova conversa
      </button>

      <nav>

        <button data-view="dashboard" type="button">
          <span>⌂</span>
          <span>Dashboard</span>
        </button>

        <button data-view="workspace" type="button">
          <span>✦</span>
          <span>VÉRTEX IA</span>
        </button>

        <button data-view="templates" type="button">
          <span>⌘</span>
          <span>Ferramentas</span>
        </button>

        <button data-view="bonuses" type="button">
          <span>🎁</span>
          <span>Bônus</span>
        </button>

        <button data-view="projects" type="button">
          <span>□</span>
          <span>Projetos</span>
        </button>

        <button data-view="history" type="button">
          <span>◷</span>
          <span>Histórico</span>
        </button>

        <button data-view="plans" type="button">
          <span>▣</span>
          <span>Planos</span>
        </button>

        <button data-view="settings" type="button">
          <span>⚙</span>
          <span>Configurações</span>
        </button>

      </nav>

      <div class="side-user">

        <div class="user-message-avatar">
          U
        </div>

        <div class="side-user-info">

          <strong id="userName">
            Usuário
          </strong>

          <span>
            Conta VÉRTEX
          </span>

        </div>

        <button
          class="logout-mini"
          onclick="logout()"
          title="Sair"
        >
          ↪
        </button>

      </div>

    </aside>


    <!-- ÁREA PRINCIPAL -->

    <main class="main">

      <header class="topbar">

        <button
          class="mobile-menu"
          type="button"
          onclick="document.body.classList.toggle('menu-open')"
        >
          ☰
        </button>

        <div class="topbar-brand">

          <div class="topbar-mark">
            <svg viewBox="0 0 100 100">
              <path d="M14 10h27l9 17 9-17h27L50 90 14 10z"/>
            </svg>
          </div>

          <div>

            <strong>VÉRTEX AI</strong>

            <span>
              Especialista em renda extra
            </span>

          </div>

        </div>

        <div class="top-actions">

          <button
            class="top-icon"
            type="button"
            onclick="openAI('')"
          >
            ⌕
          </button>

          <div class="top-user-avatar">
            R
          </div>

        </div>

      </header>


      <div class="page-header">

        <div>

          <h1 id="title">
            Dashboard
          </h1>

          <p id="sub" class="muted">
            Seu ponto de partida para renda extra no digital.
          </p>

        </div>

      </div>


      <div class="content">

        <section
          id="dashboard"
          class="view"
        ></section>

        <section
          id="workspace"
          class="view"
        ></section>

        <section
          id="templates"
          class="view"
        ></section>

        <section
          id="bonuses"
          class="view"
        ></section>

        <section
          id="projects"
          class="view"
        ></section>

        <section
          id="history"
          class="view"
        ></section>

        <section
          id="plans"
          class="view"
        ></section>

        <section
          id="settings"
          class="view"
        ></section>

      </div>

    </main>

  </div>

  <script src="/app.js"></script>

</body>
</html>
