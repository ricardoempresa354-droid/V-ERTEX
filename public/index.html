<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#ffffff">

  <title>VÉRTEX AI</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- LOGIN -->
  <section id="auth" class="auth">

    <div class="auth-card">

      <div class="auth-logo">
        V
      </div>

      <h1>VÉRTEX AI</h1>

      <p class="muted">
        Seu assistente para renda extra no digital.
      </p>

      <div class="auth-tabs">

        <button
          id="loginTab"
          class="auth-tab on"
          type="button"
          onclick="authMode('login')"
        >
          Entrar
        </button>

        <button
          id="registerTab"
          class="auth-tab"
          type="button"
          onclick="authMode('register')"
        >
          Criar conta
        </button>

      </div>

      <div id="authError" class="error"></div>

      <div id="authForm"></div>

    </div>

  </section>


  <!-- APLICAÇÃO -->
  <div id="app" class="app hidden">

    <!-- SIDEBAR -->
    <aside class="side">

      <div class="brand">

        <div class="brand-mark">V</div>

        <div class="brand-text">
          <strong>VÉRTEX AI</strong>
          <span>Especialista em renda extra</span>
        </div>

      </div>

      <button
        class="new-chat"
        type="button"
        onclick="newChat()"
      >
        <span class="new-chat-icon">＋</span>
        <span>Nova conversa</span>
      </button>

      <nav>

        <button data-view="dashboard" type="button">
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </button>

        <button data-view="workspace" type="button">
          <span class="nav-icon">✦</span>
          <span>VÉRTEX IA</span>
        </button>

        <button data-view="templates" type="button">
          <span class="nav-icon">▦</span>
          <span>Ferramentas</span>
        </button>

        <button data-view="bonuses" type="button">
          <span class="nav-icon">◇</span>
          <span>Bônus</span>
        </button>

        <button data-view="projects" type="button">
          <span class="nav-icon">□</span>
          <span>Projetos</span>
        </button>

        <button data-view="history" type="button">
          <span class="nav-icon">◷</span>
          <span>Histórico</span>
        </button>

        <button data-view="plans" type="button">
          <span class="nav-icon">▭</span>
          <span>Planos</span>
        </button>

        <button data-view="settings" type="button">
          <span class="nav-icon">⚙</span>
          <span>Configurações</span>
        </button>

      </nav>

      <div class="side-user">

        <div class="user-message-avatar">
          <span id="sideUserLetter">U</span>
        </div>

        <div class="side-user-info">
          <strong id="userName">Usuário</strong>
          <span>Conta VÉRTEX</span>
        </div>

      </div>

    </aside>


    <!-- CONTEÚDO -->
    <main class="main">

      <header class="topbar">

        <button
          class="mobile-menu"
          type="button"
          onclick="toggleMenu()"
          aria-label="Menu"
        >
          ☰
        </button>

        <div class="top-title">

          <h1 id="title">VÉRTEX AI</h1>

          <p id="sub" class="muted">
            Especialista em renda extra
          </p>

        </div>

        <div class="top-user">

          <div class="user-message-avatar">
            <span id="topUserLetter">U</span>
          </div>

        </div>

      </header>


      <section id="dashboard" class="view"></section>

      <section id="workspace" class="view"></section>

      <section id="templates" class="view"></section>

      <section id="bonuses" class="view"></section>

      <section id="projects" class="view"></section>

      <section id="history" class="view"></section>

      <section id="plans" class="view"></section>

      <section id="settings" class="view"></section>

    </main>

  </div>

  <script src="/app.js"></script>

</body>
</html>
