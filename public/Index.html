<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VÉRTEX AI</title><link rel="stylesheet" href="/style.css">
</head><body>
<div id="auth" class="auth"><div class="authbox"><div class="brand">VÉRTEX <b>AI</b></div><p>Seu centro de inteligência artificial.</p>
<div class="tabs"><button id="loginTab" class="on" onclick="authMode('login')">Entrar</button><button id="registerTab" onclick="authMode('register')">Criar conta</button></div>
<div id="authForm"></div><div id="authError" class="error"></div></div></div>
<div id="app" class="hidden"><aside class="side"><div class="brand">VÉRTEX <b>AI</b></div>
<nav><button data-view="dashboard">⌂ <span>Dashboard</span></button><button data-view="workspace">✦ <span>VÉRTEX IA</span></button><button data-view="templates">▣ <span>Ferramentas</span></button><button data-view="bonuses">🎁 <span>6 bônus</span></button><button data-view="projects">◈ <span>Meus projetos</span></button><button data-view="history">◷ <span>Histórico</span></button><button data-view="plans">◇ <span>Meu plano</span></button><button data-view="settings">⚙ <span>Configurações</span></button></nav>
<div class="upgrade"><b>VÉRTEX PRO</b><p>Mais créditos e recursos avançados.</p><button class="btn orange" onclick="show('plans')">Conhecer Pro</button></div></aside>
<main><header><div><h1 id="title">Dashboard</h1><p id="sub">Sua central de inteligência artificial.</p></div><div class="user"><span id="userName"></span><div class="avatar">V</div></div></header>
<section id="dashboard" class="view"></section>
<section id="workspace" class="view"></section>
<section id="templates" class="view"></section>
<section id="bonuses" class="view"></section>
<section id="projects" class="view"></section>
<section id="history" class="view"></section>
<section id="plans" class="view"></section>
<section id="settings" class="view"></section>
</main></div>
<script src="/app.js"></script></body></html>
